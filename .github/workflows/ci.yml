name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app
        run: ./Scripts/package_app.sh release
      - name: Zip app
        run: ditto -c -k --keepParent ClaudeBar.app ClaudeBar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeBar-app
          path: ClaudeBar.zip
          retention-days: 14
